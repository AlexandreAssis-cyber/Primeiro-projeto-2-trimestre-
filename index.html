<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confere Aí - Mitos e Verdades Sobre Saúde Visual</title>
    
    <style>
      /* --- RESET E ESTILOS DA PÁGINA --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f4f8;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      /* --- CABEÇALHO --- */
      .cabecalho {
        background-color: #2c3e50;
        color: white;
        width: 100%;
        text-align: center;
        padding: 15px 25px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      .cabecalho h1 {
        font-size: 2.2rem;
        margin-bottom: 5px;
      }

      nav a {
        color: #1abc9c;
        text-decoration: none;
        font-weight: bold;
      }

      /* --- ÁREA PRINCIPAL --- */
      main {
        width: 95%;
        max-width: 1200px;
        padding: 40px 10px;
        text-align: center;
        flex: 1;
      }

      h2 {
        color: #7f8c8d;
        font-weight: normal;
        margin-bottom: 40px;
      }

      .container-cartoes {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        justify-content: center;
      }

      /* --- EFEITO DE GIRAR 180 GRAUS --- */
      .cartao {
        background-color: transparent;
        width: 280px;  
        height: 360px; 
        perspective: 1000px; /* Ativa o ambiente 3D */
      }

      .cartao-interno {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.8s ease; 
        transform-style: preserve-3d; /* Mantém os lados em 3D */
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        border-radius: 12px;
      }

      /* Gira exatamente 180 graus no eixo Y ao passar o mouse */
      .cartao:hover .cartao-interno {
        transform: rotateY(180deg);
      }

      .cartao-frente, .cartao-verso {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* Esconde o fundo enquanto gira */
        backface-visibility: hidden;
        border-radius: 12px;
        border: 1px solid #e0e0e0;
        padding: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Lado da Frente (Fundo Branco) */
      .cartao-frente {
        background-color: white;
        color: #333;
      }

      /* Lado de Trás (Fundo Escuro) */
      .cartao-verso {
        background-color: #2c3e50;
        color: white;
        transform: rotateY(180deg); /* Já começa invertido de costas */
        border-color: #1abc9c;
      }

      /* --- DETALHES DAS IMAGENS E TEXTOS --- */
      .cartao-imagem {
        width: 90px;
        height: 90px;
        object-fit: contain;
        margin-bottom: 20px;
      }

      .tipo-info {
        font-weight: bold;
        font-size: 1.1rem;
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      .cartao-frente .tipo-info {
        color: #e74c3c; /* Vermelho para o Mito */
      }

      .cartao-verso .tipo-info {
        color: #1abc9c; /* Verde para a Verdade */
      }

      .texto-card {
        font-size: 0.95rem;
        line-height: 1.5;
      }

      /* --- RODAPÉ --- */
      footer {
        background-color: #2c3e50;
        color: white;
        width: 100%;
        text-align: center;
        padding: 15px 0;
        margin-top: auto;
      }
    </style>
  </head>
  <body>

    <header class="cabecalho"> 
      <h1>Confere Aí</h1> 
      <nav> 
        <a href="#">Início</a> 
      </nav> 
    </header> 

    <main>

              <p class="tipo-info">MITO</p>
              <p class="texto-card">Forçar a vista para ler no escuro aumenta a miopia permanentemente!</p> 
            </div> 
            
            <div class="cartao-verso"> 
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Crystal_Clear_app_lightbulb.svg" alt="Lâmpada acesa" class="cartao-imagem"> 
              <p class="tipo-info">VERDADE</p>
              <p class="texto-card">Ler no escuro causa apenas cansaço visual temporário. Não altera a estrutura física do olho.</p> 
            </div> 

          </div> 
        </article>

          <div class="cartao-interno">

              <img src="https
